
name: Build DeepSpace LoveInfinity

on:
  workflow_dispatch:
  push:
    paths:
      - "DeepSpace_LoveInfinity_source_update_01.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -q DeepSpace_LoveInfinity_source_update_01.zip -d source

      - name: Build APK
        run: |
          gradle -p source/DeepSpace_LoveInfinity_v1_local assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSpace-LoveInfinity-APK
          path: source/DeepSpace_LoveInfinity_v1_local/app/build/outputs/apk/debug/app-debug.apk
          
