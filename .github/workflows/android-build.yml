
name: Build DeepSpace LoveInfinity APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify source ZIP exists
        run: |
          test -f DeepSpace_LoveInfinity_source_update_01.zip
          unzip -t DeepSpace_LoveInfinity_source_update_01.zip

      - name: Extract Android source ZIP
        run: |
          unzip -q DeepSpace_LoveInfinity_source_update_01.zip -d source

      - name: Verify updated account and pairing code
        run: |
          APP="source/DeepSpace_LoveInfinity_v1_local/app/src/main/java/com/loveinfinity/deepspace/MainActivity.kt"
          test -f "$APP"
          grep -F "ACCOUNT & PARTNER PAIRING" "$APP"
          grep -F "Create account" "$APP"
          grep -F "Create partner pairing code" "$APP"

      - name: Configure Android build
        run: |
          cat > source/DeepSpace_LoveInfinity_v1_local/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.loveinfinity.deepspace"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.loveinfinity.deepspace"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p source/DeepSpace_LoveInfinity_v1_local \
            assembleDebug

      - name: Verify APK exists
        run: |
          APK="source/DeepSpace_LoveInfinity_v1_local/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSpace-LoveInfinity-APK
          path: source/DeepSpace_LoveInfinity_v1_local/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
